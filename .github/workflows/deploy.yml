name: CI y despliegue a GitHub Pages

# En pull requests solo se ejecutan los controles; el despliegue ocurre
# únicamente con push a master (o a mano) y si todos los controles pasan.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Controles de calidad y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Las acciones se fijan por SHA de commit; el comentario indica la versión
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias (falla con severidad alta o crítica, salvo scripts/audit-allowlist.json)
        run: npm run check:audit

      - name: Contenido bilingüe es/en
        run: npm run check:i18n

      - name: Imágenes optimizadas y sin metadatos
        run: npm run check:images

      - name: Tipos y contenido (astro check)
        run: npm run check

      - name: Build
        run: npx astro build

      - name: Enlaces internos y anclajes
        run: npm run check:links

      - name: Lighthouse
        run: npm run lighthouse

      - name: Guardar reportes de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

      - name: Preparar artefacto de Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Desplegar
    needs: verify
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
